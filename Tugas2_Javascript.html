<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pegawai - JavaScript</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f0ff, #f7f9fc);
            min-height: 100vh;
            padding: 50px 20px;
            color: #1f2937;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #1e3a8a;
        }

        .header p {
            color: #6b7280;
            font-size: 15px;
        }

        .table-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        thead {
            background: #1e3a8a;
            color: white;
        }

        th {
            padding: 16px 12px;
            font-size: 13px;
            text-align: center;
        }

        td {
            padding: 16px 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: center;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f1f5ff;
        }

        tbody td:first-child {
            font-weight: bold;
            color: #1e3a8a;
            text-transform: capitalize;
        }

        tfoot {
            background: #eef2ff;
        }

        tfoot th {
            color: #1e3a8a;
            font-size: 15px;
            text-align: right;
        }

        #totalGaji {
            color: #15803d;
            font-size: 16px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .jabatan {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status {
            background: #dcfce7;
            color: #15803d;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #6b7280;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Data Pegawai</h1>
            <p>Informasi dan perhitungan gaji pegawai menggunakan JavaScript</p>
        </div>

        <div class="table-card">

            <table>
                <thead>
                    <tr>
                        <th>Nama Pegawai</th>
                        <th>Umur</th>
                        <th>Jabatan</th>
                        <th>Status</th>
                        <th>Gaji Pokok</th>
                        <th>Tunjangan Jabatan</th>
                        <th>BPJS</th>
                        <th>Tunjangan Keluarga</th>
                        <th>Total Gaji</th>
                    </tr>
                </thead>

                <tbody id="dataPegawai">
                </tbody>

                <tfoot>
                    <tr>
                        <th colspan="8">TOTAL GAJI</th>
                        <th id="totalGaji"></th>
                    </tr>
                </tfoot>
            </table>

        </div>

        <div class="footer">
            Tugas 2 - JavaScript | Data Pegawai
        </div>

    </div>

    <script>
        // Data pegawai
        let nama = "Dodi Prayodi";
        let umur = 25;
        let jabatan = "Manajer";
        let status = "Menikah";

        // Menentukan gaji pokok menggunakan IF
        let gapok;

        if (jabatan == "Manajer") {
            gapok = 15000000;
        } else if (jabatan == "Asisten Manajer") {
            gapok = 10000000;
        } else if (jabatan == "Staff") {
            gapok = 5000000;
        }

        // Tunjangan Jabatan 15%
        let tunjanganJabatan = 15 / 100 * gapok;

        // BPJS 10%
        let bpjs = 10 / 100 * gapok;

        // Tunjangan Keluarga menggunakan Ternary
        let tunjanganKeluarga =
            status == "Menikah" ? 20 / 100 * gapok : 0;

        // Total Gaji
        let totalGaji =
            gapok +
            tunjanganJabatan +
            bpjs +
            tunjanganKeluarga;

        // Menampilkan data ke TBody
        document.getElementById("dataPegawai").innerHTML = `
            <tr>
                <td>${nama}</td>
                <td>${umur} Tahun</td>
                <td>
                    <span class="badge jabatan">${jabatan}</span>
                </td>
                <td>
                    <span class="badge status">${status}</span>
                </td>
                <td>Rp ${gapok.toLocaleString("id-ID")}</td>
                <td>Rp ${tunjanganJabatan.toLocaleString("id-ID")}</td>
                <td>Rp ${bpjs.toLocaleString("id-ID")}</td>
                <td>Rp ${tunjanganKeluarga.toLocaleString("id-ID")}</td>
                <td>
                    <strong>
                        Rp ${totalGaji.toLocaleString("id-ID")}
                    </strong>
                </td>
            </tr>
        `;

        // Menampilkan total gaji pada TFoot
        document.getElementById("totalGaji").innerHTML =
            "Rp " + totalGaji.toLocaleString("id-ID");
    </script>

</body>
</html>
